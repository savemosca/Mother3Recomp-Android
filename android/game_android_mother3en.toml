# Runtime-only Android configuration for MOTHER 3 (English fan translation).
# Files are installed beneath Android app-private storage.

[game]
name           = "MOTHER 3"
short_name     = "mother3en"
default_region = "en"

[bios]
path = "../../bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

[rom]
path = "../../roms/mother3_en.gba"

[program]
name         = "MOTHER 3 (EN)"
id           = "mother3en"
load_address = 0x08000000
size         = 0x02000000
entry_pc     = 0x08000000

[identity]
sha1 = "306fb8874533b0fd0796208faa8bed2db4ae77fb"

[save]
type = "flash512"

[runtime]
debug_port   = 19894
window_title = "Mother3RecompEN"

[video]
# Integer nearest prescale + linear finish. Only active when the image is not
# an exact integer multiple, e.g. 6.75x full-height on a 1920x1080 handheld
# with the touch pad hidden; keeps every GBA pixel the same width.
sharp_filter = true
# Present-time colour simulation: raw|unlit|frontlit|backlit|classic.
# Raw is very saturated on AMOLED panels; backlit approximates a GBA SP.
# screen = "backlit"
