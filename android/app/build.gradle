plugins {
    id "com.android.application"
}

def gameRoot = rootDir.parentFile
def pick = { String prop, String env, File fallback ->
    def value = providers.gradleProperty(prop).orNull ?: System.getenv(env)
    return value ? new File(value) : fallback
}
def engineRoot = pick("gbarecompRoot", "GBARECOMP_ROOT", new File(gameRoot, "gbarecomp"))
def recompUiRoot = pick("recompUiRoot", "RECOMP_UI_ROOT", new File(gameRoot, "recomp-ui"))

def requested = (providers.gradleProperty("mother3Variant").orNull ?: "en")
    .toString().toLowerCase()
def english = ["en", "english", "mother3en"].contains(requested)
if (!english && !["jp", "jpn", "ja", "mother3"].contains(requested)) {
    throw new GradleException(
        "Unknown -Pmother3Variant=${requested}. Use en (default) or jpn.")
}

// -Pmother3Device=rg556 tunes the native build for one handheld (see
// MOTHER3_ANDROID_TUNE in ../CMakeLists.txt). Empty = generic arm64.
def device = (providers.gradleProperty("mother3Device").orNull ?: "").toString().toLowerCase()
if (!["", "rg556"].contains(device)) {
    throw new GradleException("Unknown -Pmother3Device=${device}. Use rg556 or omit it.")
}
// -Pmother3GeneratedOpt=-O2 raises the generated corpus above its default -O1
// (much longer, more memory-hungry native compile).
def generatedOpt = providers.gradleProperty("mother3GeneratedOpt").orNull

def variant = english ? "mother3en" : "mother3"
def romFile = english ? "mother3_en.gba" : "mother3_jpn.gba"
def romSha1 = english
    ? "306fb8874533b0fd0796208faa8bed2db4ae77fb"
    : "4f0f493e12c2a8c61b2d809af03f7abf87a85776"
def title = english ? "MOTHER 3 (EN)" : "MOTHER 3"
def androidToml = new File(rootDir,
    english ? "game_android_mother3en.toml" : "game_android_mother3.toml")

ext.gbaGame = [
    applicationId  : english
        ? "com.ylports.mother3recomp.en.dev"
        : "com.ylports.mother3recomp.jpn.dev",
    versionCode    : 2,
    versionName    : device ? "0.1.3-fast-${device}" : "0.1.3-fast",
    title          : title,
    romLabel       : english
        ? "MOTHER 3 English fan-translation ROM"
        : "MOTHER 3 Japanese ROM",
    romSha1        : [romSha1],
    romSize        : 33554432,
    romFile        : romFile,
    biosRequired   : true,
    orientation    : "landscape",
    // Bump whenever the packaged game.toml changes so installs pick it up.
    payloadVersion : "3",
    setupNote      : "Import your own compatible ROM and a GBA BIOS dump. " +
                     "The public APK does not include any Nintendo files.",
    variant        : variant,
    gameToml       : androidToml,
    payloadDirs    : [
        [from: new File(gameRoot, "variants/${variant}/config"),
         into: "variants/${variant}/config"],
    ],
    gameRoot       : gameRoot,
    engineRoot     : engineRoot,
    recompUiRoot   : recompUiRoot,
    cmakeArguments : ["-DMOTHER3_ANDROID_VARIANT=${variant}",
                      "-DMOTHER3_ANDROID_TUNE=${device}"] +
                     (generatedOpt ? ["-DMOTHER3_GENERATED_OPT=${generatedOpt}"] : []),
    nativeJobs     : 2,
    releaseAbis    : ["arm64-v8a"],
    debugAbis      : ["arm64-v8a", "x86_64"],
]

apply from: new File(engineRoot, "platform/android/gbarecomp-app.gradle")

dependencies {
    // Hoard serves cloud saves as tar.zst; zstd-jni ships the arm64 decoder.
    implementation "com.github.luben:zstd-jni:1.5.7-23@aar"
}

android.sourceSets.main.manifest.srcFile file("src/main/AndroidManifest.xml")
android.sourceSets.main.java.srcDir file("src/main/java")
